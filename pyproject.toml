[project]
name = "stl-find-ball"
version = "0.1.4"
description = "find ball structure in a certain .stl model."
authors = [
    {name = "GGN_2015",email = "neko@jlulug.org"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
    "numpy",
    "scipy",
    "trimesh",
    "tqdm",
    "vtk",
    "live_chrono"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
